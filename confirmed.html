<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed - 17 Jewels</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brown: #2C1810;
      --gold: #D4AF37;
      --cream: #FAFAF8;
      --white: #FFFFFF;
      --text-light: #6B5D52;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 25px,
        rgba(212, 175, 55, 0.03) 25px,
        rgba(212, 175, 55, 0.03) 26px
      );
      pointer-events: none;
    }

    .container {
      background: var(--cream);
      padding: 3rem;
      border-radius: 20px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      position: relative;
      z-index: 1;
      border: 3px solid var(--gold);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
    }

    .success-icon svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 3;
      fill: none;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      color: var(--brown);
      margin-bottom: 1rem;
    }

    p {
      color: var(--text-light);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background: var(--gold);
      color: var(--brown);
      padding: 1rem 2rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
    }

    .footer-text {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-light);
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/logo.png" alt="17 Jewels" class="logo">
    
    <div class="success-icon">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    
    <h1>Email Confirmed!</h1>
    
    <p>
      Your email has been verified successfully. You can now return to the 
      <strong>17 Jewels</strong> app and sign in to start cataloging your pocket watch collection.
    </p>
    
    <a href="pocketwatchapp://" class="btn">Open 17 Jewels App</a>
    
    <p class="footer-text">
      If the button doesn't work, simply open the app manually on your device.
    </p>
  </div>
</body>
</html>
